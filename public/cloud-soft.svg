<?xml version="1.0" encoding="UTF-8"?>
<!-- A square canvas lets every cloud billboard keep the same proportions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- This radial gradient feathers each cloud puff into transparent sky. -->
  <defs>
    <radialGradient id="soft-cloud-puff">
      <!-- The opaque center gives overlapping puffs a softly modelled body. -->
      <stop offset="0" stop-color="white" stop-opacity="0.98" />
      <!-- The broad middle keeps the cloud full without producing a hard disc. -->
      <stop offset="0.48" stop-color="white" stop-opacity="0.82" />
      <!-- The outer quarter begins the gradual transparent falloff. -->
      <stop offset="0.78" stop-color="white" stop-opacity="0.28" />
      <!-- A transparent edge makes adjacent billboards blend invisibly. -->
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- One full-size circle becomes a reusable soft particle in Three.js. -->
  <circle cx="64" cy="64" r="64" fill="url(#soft-cloud-puff)" />
</svg>
